name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-apps:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, admin, superadmin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Prisma client
        if: matrix.app == 'backend'
        run: npx prisma generate
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  portal:
    name: portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --if-present
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  docker-build:
    name: docker build check
    runs-on: ubuntu-latest
    needs: [npm-apps, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
