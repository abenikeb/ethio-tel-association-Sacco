name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: image ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: backend, dockerfile: docker/backend.Dockerfile }
          - { app: frontend, dockerfile: docker/next-npm.Dockerfile }
          - { app: admin, dockerfile: docker/next-npm.Dockerfile }
          - { app: superadmin, dockerfile: docker/next-npm.Dockerfile }
          - { app: portal, dockerfile: docker/next-pnpm.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image prefix
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ matrix.app == 'portal' && vars.PORTAL_API_URL || vars.PUBLIC_API_URL }}
          tags: |
            ${{ env.PREFIX }}/${{ matrix.app }}:latest
            ${{ env.PREFIX }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy
    needs: images
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production # add required reviewers in repo settings for manual approval
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image prefix
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ vars.DEPLOY_PATH }}
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_PREFIX: ${{ env.PREFIX }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_PREFIX,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_PREFIX
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy
            docker image prune -f
